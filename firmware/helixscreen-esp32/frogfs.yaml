# frogfs (jkent/frogfs) packer config for the ESP32 `storage` partition.
# Consumed by scripts/esp32_pack_assets.py, which invokes mkfrogfs.py
# directly (not via frogfs's own CMake macros — see that script's docstring
# for why). $staging is set from the FROGFS_STAGING_DIR env var the packer
# script exports, pointing at build/littlefs_staging/ (the staging tree
# scripts/esp32_stage_assets.py assembles).

define:
  staging: ${ENV:FROGFS_STAGING_DIR}

collect:
  $staging/: ""

filter:
  # Text assets (ui_xml, JSON config) deflate well; store them compressed.
  "*":
    - compress zlib:
        level: 9
  # PNGs are already compressed (DEFLATE-based); re-compressing wastes CPU
  # at read time for no space win, so store them raw-in-container.
  "*.png":
    - no compress
