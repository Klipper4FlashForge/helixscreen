name: Auto-Milestone

# Newly opened issues land in the Backlog milestone so nothing sits unmilestoned.
# Triage moves them to 1.0 / 1.1 from there; this only ever sets the initial value.
on:
  issues:
    types: [opened]

jobs:
  assign-backlog:
    name: Assign Backlog milestone
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # The repo default for GITHUB_TOKEN is read-only; elevate just this job
    # rather than widening the workflow-level default.
    permissions:
      issues: write
    # An issue opened with a milestone already set (API, or a maintainer picking one
    # in the same action) keeps it. This job never overwrites a deliberate choice.
    if: github.event.issue.milestone == null

    steps:
    - name: Assign the Backlog milestone
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ISSUE: ${{ github.event.issue.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # Resolve by title, not by hardcoded number: milestone numbers are stable
        # today but a delete/recreate would silently retarget every new issue.
        number=$(gh api "repos/$REPO/milestones?state=open&per_page=100" \
          --jq '.[] | select(.title == "Backlog") | .number')

        if [ -z "$number" ]; then
          echo "::error::No open milestone titled 'Backlog' in $REPO - cannot assign."
          exit 1
        fi

        gh api -X PATCH "repos/$REPO/issues/$ISSUE" -F milestone="$number" --silent
        echo "Assigned issue #$ISSUE to milestone 'Backlog' (#$number)."
